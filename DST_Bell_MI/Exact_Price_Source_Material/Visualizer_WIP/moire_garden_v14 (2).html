<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Moiré Garden — a map of relative phase (v14)</title>
<style>
body{margin:0;background:#0b0e12;color:#d8d5cc;font-family:Georgia,serif;overflow-x:hidden}
#hdr{text-align:center;padding:14px 0 4px}
#hdr h1{font-size:22px;font-weight:normal;letter-spacing:2px;margin:0;color:#9FE1CB}
#hdr p{font-size:13px;color:#888780;margin:4px 0 0;font-style:italic}
#tabs{display:flex;justify-content:center;gap:6px;padding:10px 0}
.tab{background:#12161c;border:1px solid #26302c;color:#B4B2A9;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit}
.tab.on{background:#0F3D30;color:#9FE1CB;border-color:#1D9E75}
#stage{display:block;margin:6px auto;background:#0d1117;border:1px solid #1c2128;border-radius:8px}
#bar{display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap;padding:8px;font-size:12px;color:#B4B2A9}
#bar label{display:flex;align-items:center;gap:6px}
#bar input[type=range]{width:120px;accent-color:#1D9E75}
#bar button{background:#1a1f26;border:1px solid #3a4a44;color:#9FE1CB;padding:5px 12px;border-radius:5px;cursor:pointer;font-family:inherit;font-size:12px}
#cap{max-width:940px;margin:2px auto 24px;font-size:13px;color:#9a978e;line-height:1.6}
#cap .lead{color:#c9c6bd}
.v{color:#AFA9EC}.t{color:#5DCAA5}.e{color:#F0997B}
#cap .nar{display:block;margin-top:10px;padding:8px 12px;border-left:2px solid #26302c;color:#8fa79c;font-style:italic}
#cap .nar b{font-style:normal;color:#9FE1CB}
#hdr .tier{font-size:11px;color:#6f7a76;font-style:normal;margin-top:6px}
#bar .reg{color:#F0997B;min-width:190px}
</style>
</head>
<body>
<div id="hdr"><h1>THE MOIRÉ GARDEN</h1>
<p>a map of relative phase, run live on the equations it earned — v14</p>
<p class="tier">Exploratory visualization (sandbox tier). Standalone results: arXiv:2608.18886 · arXiv:2608.00124. Nothing on this page is required by either paper.</p></div>
<div id="tabs"></div>
<canvas id="stage" width="1100" height="600"></canvas>
<div id="bar"></div>
<div id="cap"></div>
<script>
"use strict";
const cv=document.getElementById('stage'),cx=cv.getContext('2d');
const W=cv.width,H=cv.height,TAU=Math.PI*2;
const COL={teal:'#5DCAA5',teal2:'#1D9E75',vio:'#AFA9EC',vio2:'#7F77DD',emb:'#D85A30',embL:'#F0997B',dim:'#888780',bg:'#0d1117'};
const H_M=[0,0.025,0.05,0.1,0.15,0.2,0.25,0.3,0.35,0.4,0.45,0.5,0.55,0.6,0.65,0.7,0.75,0.8,0.85,0.9,0.95,1],
H_V=[1.17451,1.17372,1.17106,1.16496,1.15789,1.15012,1.14180,1.13300,1.12377,1.11414,1.10414,1.09379,1.08311,1.07211,1.06081,1.04922,1.03735,1.02521,1.01281,1.00016,1.00008,1];
function hInterp(m){let i=1;while(i<H_M.length-1&&H_M[i]<m)i++;
 const t=(m-H_M[i-1])/(H_M[i]-H_M[i-1]);return H_V[i-1]+t*(H_V[i]-H_V[i-1]);}
function Dm(m){m=Math.max(0,Math.min(1,m));return Math.sqrt(m)*hInterp(m);}
function clear(){cx.fillStyle=COL.bg;cx.fillRect(0,0,W,H);}
function txt(s,x,y,c,sz,al){cx.fillStyle=c||COL.dim;cx.font=(sz||13)+'px Georgia';cx.textAlign=al||'left';cx.fillText(s,x,y);}
const tabsEl=document.getElementById('tabs'),barEl=document.getElementById('bar'),capEl=document.getElementById('cap');
let scenes=[],cur=0,frame=0;
function slider(lbl,min,max,step,val,cb){const l=document.createElement('label');
 l.innerHTML=lbl+' ';const i=document.createElement('input');i.type='range';
 i.min=min;i.max=max;i.step=step;i.value=val;const o=document.createElement('span');
 o.textContent=val;o.style.minWidth='34px';o.style.color='#9FE1CB';
 i.oninput=()=>{o.textContent=(+i.value).toFixed(step<1?(step<0.1?2:1):0);cb(+i.value);};
 l.appendChild(i);l.appendChild(o);barEl.appendChild(l);return i;}
function button(lbl,cb){const b=document.createElement('button');b.textContent=lbl;b.onclick=cb;barEl.appendChild(b);return b;}
function setScene(k){cur=k;barEl.innerHTML='';capEl.innerHTML=scenes[k].cap;
 scenes[k].ui();document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('on',i===k));}

/* ================= SCENE 1 : THE WALKWAY ================= */
(function(){
let dth=22.5,rj=0.02,drift=0.6,pan=0,mode=0;
function regime(r){return r<0.01?'cold crystal (zero-point floor ≈ 0.005)':r<0.03?'crystal at room temperature (calcite ≈ 0.02)':r<0.08?'hot solid':r<0.15?'melting — Lindemann threshold ≈ 0.1':r<0.35?'liquid':'gas — no persistent cells';}
let dither=false;
let FW=220,FH=120;
let field=new Float32Array(FW*FH);
const off=document.createElement('canvas');off.width=FW;off.height=FH;
let octx=off.getContext('2d');let idata=octx.createImageData(FW,FH);
function setRes(w){FW=w|0;FH=Math.round(FW*120/220);
 field=new Float32Array(FW*FH);off.width=FW;off.height=FH;
 octx=off.getContext('2d');idata=octx.createImageData(FW,FH);}
function lat(u,p,ph){return 0.5+0.5*Math.cos(TAU*u/p+ph);}
function fieldAt(x,y){
 const th=dth*Math.PI/180,jp=rj*TAU;
 const c1=Math.cos(Math.PI/4),s1=Math.sin(Math.PI/4);
 const ct=Math.cos(th+Math.PI/4),st=Math.sin(th+Math.PI/4);
 const j1=jp*Math.sin(0.05*x+frame*0.02),j2=jp*Math.sin(0.04*y-frame*0.017+2);
 const dp=TAU*pan/26;
 const P=lat(x*c1+y*s1,14,j1)*lat(-x*s1+y*c1,14,-j1);
 const A=lat(x*ct+y*st,26,j2+dp)*lat(-x*st+y*ct,26,j2+dp);
 return P*A;}
function computeField(){
 for(let iy=0;iy<FH;iy++)for(let ix=0;ix<FW;ix++){
  const x=(ix-FW/2)*(1100/FW),y=(iy-FH/2)*(600/FH);
  field[iy*FW+ix]=fieldAt(x,y);}}
function fence(pitch,ang,phase,color,lw,alpha,jit){
 cx.save();cx.beginPath();cx.rect(0,0,W-250,H);cx.clip();
 cx.translate((W-250)/2,H/2);cx.rotate(ang);cx.globalAlpha=alpha;
 cx.strokeStyle=color;cx.lineWidth=lw;
 const R=Math.hypot(W,H);
 for(const dir of [Math.PI/4,-Math.PI/4]){
  cx.save();cx.rotate(dir);
  for(let u=-R;u<R;u+=pitch){
   const j=jit*Math.sin(u*0.13+frame*0.02+phase);
   cx.beginPath();cx.moveTo(u+phase%pitch+j,-R);cx.lineTo(u+phase%pitch+j,R);cx.stroke();}
  cx.restore();}
 cx.globalAlpha=1;cx.restore();}
scenes.push({name:'1 · the walkway',
cap:'<span class=lead>This picture is a map of relative phase, not a photograph of a room.</span> Every point on the plane is a possible relationship between two lattices. The plane is the register; the lab floor is elsewhere.<br><br>Take a photon, and the atoms of a polarizer, to be phase relationships between two things. The <span class=v>large mesh is the photon</span> — not one photon but every position a photon’s phase relationship could occupy, drawn at once. The <span class=t>small mesh is the polarizer’s lattice</span>, itself built of phase relationships. Where the two overlap, the beat between them is the photon’s state against that polarizer. <b>Nodes</b> grades every crossing by how strongly the two meshes agree: <span class=e>ember — the two lock</span>; a photon at an ember node is always registered. <span class=v>Violet — the two neither lock nor anti-lock</span>: the undecided register, m = |cos 2(λ−a)| → 0, where a photon slides past the polarizer unregistered, because in phase space the photon has become part of the thing it is meeting. The contiguous violet lines are lines of constant relative phase. They are not paths and nothing travels along them; their orientation is fixed by Δθ alone and survives every amount of jitter.<br><br><b>Relative angle Δθ</b> turns one mesh against the other; the beat wavelength p/(2 sin(Δθ/2)) is printed above. <b>Drift</b> slides the photon mesh across the fixed polarizer mesh at a constant rate — the detuning v of Eq. (4) in arXiv:2608.18886 — and the pattern translates by the lever arm while the census at right does not move: rates are flat under drift, and only Δθ changes them. <b>Jitter / pitch</b> displaces the fence lines by that fraction of their spacing, as one long-wavelength displacement wave (a single phonon, not incoherent noise). The scale is logarithmic because every solid you will ever put in a beam sits near the bottom of it: a calcite polarizer at 300 K has jitter/pitch ≈ 0.02, zero-point motion floors it near 0.005, and solids melt near 0.1 (Lindemann). The violet diamond shape that emerges from overlaying all possible positions of the photon’s phase is the default condition of matter, not a low-temperature exception; above ≈ 0.1 the slider describes liquids and gases, which have no persistent violet diamond cells and therefore no orientation to hand a photon. The <b>histogram</b> is the census of node strengths, and that census is the rate observable: how it moves with Δθ is what the fourfold-sum fringe of tab 5 measures, and what quantum mechanics says never moves.<span class=nar><b>Narrative — the walkway.</b> A pedestrian bridge over a busy road, chain-link fence on both sides, seen from a restaurant at its height. From the table you do not see two fences; you see the pattern the two make together, and as you move along the room the pattern moves with you, the same pattern from every seat. That is a person looking at a relationship between two things and seeing neither thing. The Garden is that lunch with the fences named: in this narrative the two fences are the two meshes and the walk along the room is the drift slider, and the relationship you saw over lunch is the object the physics is about.</span>',
ui(){slider('relative angle Δθ',0,90,0.5,dth,v=>dth=v);
 slider('node grid resolution',120,520,1,FW,v=>setRes(v));
 const ls=slider('jitter / pitch (log scale)',-3,0,0.01,Math.log10(rj),v=>{rj=Math.pow(10,v);});
 const lo_=ls.nextSibling;const rg=document.createElement('span');rg.className='reg';
 const upd=()=>{lo_.textContent=rj.toFixed(3);rg.textContent=regime(rj);};ls.addEventListener('input',upd);upd();barEl.appendChild(rg);
 slider('drift',0,2,0.05,drift,v=>drift=v);
 const db=button('sample dither: OFF (grid census)',()=>{dither=!dither;
  db.textContent='sample dither: '+(dither?'ON (fair sampling)':'OFF (grid census)');});
 button('nodes ⇄ lines',()=>mode=1-mode);},
step(){pan+=drift;},
draw(){clear();computeField();
 if(!window._gTH){const samp=[];
  for(let i=0;i<field.length;i+=13)samp.push(field[i]);
  samp.sort((a,b)=>a-b);
  window._gTH={lo:samp[Math.floor(samp.length*0.10)],
   med:samp[Math.floor(samp.length*0.5)],
   hi:samp[Math.floor(samp.length*0.92)]};}
 const lo=window._gTH.lo,med=window._gTH.med,hi=window._gTH.hi;
 if(mode===0){
  for(let i=0;i<field.length;i++){const v=field[i],k=4*i;
   if(v>=hi){idata.data[k]=188;idata.data[k+1]=84;idata.data[k+2]=52;}
   else if(v<=lo){idata.data[k]=168;idata.data[k+1]=148;idata.data[k+2]=236;}
   else if(v<med){idata.data[k]=24;idata.data[k+1]=92;idata.data[k+2]=78;}
   else{idata.data[k]=46;idata.data[k+1]=148;idata.data[k+2]=118;}
   idata.data[k+3]=255;}
  octx.putImageData(idata,0,0);
  cx.imageSmoothingEnabled=true;
  cx.drawImage(off,0,0,W-250,H);
 } else {
  cx.globalCompositeOperation='lighter';
  fence(14,0,0,COL.teal2,1.0,0.5,rj*14);
  fence(26,dth*Math.PI/180,pan,COL.vio2,1.6,0.45,rj*26);
  cx.globalCompositeOperation='source-over';
 }
 const cN=[0,0,0,0];
 if(dither){
  for(let i=0;i<6000;i++){
   const x=(Math.random()-0.5)*1100,y=(Math.random()-0.5)*600;
   const v=fieldAt(x,y);
   cN[v>=hi?0:(v<=lo?3:(v<med?2:1))]++;}
 } else {
  for(let i=0;i<field.length;i+=5){const v=field[i];
   cN[v>=hi?0:(v<=lo?3:(v<med?2:1))]++;}
 }
 const tot=cN[0]+cN[1]+cN[2]+cN[3];
 let hm=1;for(const c of cN)hm=Math.max(hm,c);
 const hx=W-230,hy=90,hw=190,hh=380;
 txt('node color populations',hx,hy-14,COL.dim,13);
 txt('(these four counts ARE the',hx,hy+hh+22,COL.dim,11);
 txt('rate observable)',hx,hy+hh+38,COL.dim,11);
 cx.strokeStyle='#26302c';cx.strokeRect(hx,hy,hw,hh);
 const names=['ember','light teal','dark teal','violet'];
 const cols=['rgb(188,84,52)','rgb(46,148,118)','rgb(24,92,78)','rgb(168,148,236)'];
 for(let b=0;b<4;b++){const y=hy+30+b*92;
  const w=cN[b]/hm*(hw-16);
  cx.fillStyle=cols[b];cx.fillRect(hx+8,y,Math.max(w,2),54);
  txt(names[b]+'  '+(100*cN[b]/tot).toFixed(1)+'%',hx+8,y+70,cols[b],12);}

 txt('ember = the two fences lock (always registered)',hx,hy-34,COL.embL,11);
 const beat=dth>0.5?(14/(2*Math.sin(dth*Math.PI/360))).toFixed(0):'∞';
 txt('beat wavelength ≈ '+beat+' px   ·   Δθ = '+dth.toFixed(1)+'°   ·   jitter/pitch = '+rj.toFixed(3)+' — '+regime(rj)+'   ·   view: '+(mode?'lines':'nodes')+'   ·   v14',20,30,COL.teal,13);}});
})();

/* ================= SCENE 2 : THE JOINT BEAT ================= */
(function(){
let v=7,kap=1.0,tauMean=3.0,tauSpread=0.6,pairIdx=0,view=0;
const k1=0.22,k2=1.21;
const pairs=[[0,22.5],[0,67.5],[45,22.5],[45,67.5]];
const N=420;let walkers=[],hist=new Float32Array(72);
function U(l,a,b){const A=2*(l-a),B=2*(l+Math.PI/2-b);
 return -kap*(k1*Math.cos(A)+k1*Math.cos(B)+0.5*k2*Math.cos(A+B));}
function dU(l,a,b){const A=2*(l-a),B=2*(l+Math.PI/2-b);
 return kap*(k1*2*(Math.sin(A)+Math.sin(B))+k2*2*Math.sin(A+B));}
function spawn(){walkers=[];hist.fill(0);
 for(let i=0;i<N;i++)walkers.push({lam:Math.random()*Math.PI,
  tau:tauMean*(1+tauSpread*(Math.random()*2-1)),age:0,frozen:false});}
spawn();
const GW=140,GH=76;let G=new Float32Array(GW*GH);
function buildField(){const a=pairs[pairIdx][0]*Math.PI/180,b=(pairs[pairIdx][1]+90)*Math.PI/180;
 const q=TAU/64;
 for(let iy=0;iy<GH;iy++)for(let ix=0;ix<GW;ix++){
  const x=ix*7.8,y=iy*7.8;
  G[iy*GW+ix]=(0.5+0.5*Math.cos(q*(x*Math.cos(a)+y*Math.sin(a))))*
              (0.5+0.5*Math.cos(q*(x*Math.cos(b)+y*Math.sin(b))));}}
buildField();
scenes.push({name:'2 · the joint beat',
cap:'<span class=lead>The joint beat: the pattern the two analyzers make together, and what that pattern does to a hidden phase.</span> In Eq. (4) of arXiv:2608.18886 the pair’s hidden phase λ does not evolve under Alice’s fence alone or Bob’s alone; it evolves under one function U(λ) whose shape is fixed by both settings at once — the standing beat pattern of the apparatus. This tab shows that one function two ways. <b>Ring</b>: the register λ on [0, π), with <span class=t>Alice’s axis in teal</span> and <span class=v>Bob’s in violet</span>; the violet curve inside the ring is U(λ) itself, drawn so that dips toward the centre are locks, the places where v − U′ = 0 and a phase that arrives there stops. <b>Field</b>: the same two fences overlaid on a plane at their setting angles, so you can see the beat they make; the profile along the bottom is U(λ), the register slice through that beat. Cycle the setting pair and both views change together, because both are the apparatus.<br><br><b>The phases.</b> Each teal dot is one pair’s λ, drawn uniformly at birth and then run deterministically, dλ/dt = v − U′(λ), for a frozen flight time τ. No noise anywhere: nothing shakes the dots, nothing rolls dice. A phase in the running regime moves fast where v − U′ is large and slow where the joint beat holds it back, so it spends more time near the dips — the residence-time law. A phase whose v is smaller than the beat’s steepest slope is captured at a lock and stops early. When a phase’s τ runs out it freezes where it stands and is added to the census — the ember bars. That census depends on (a, b) because U does; that dependence is measurement dependence, and it is the entire price the mechanism pays. <b>Drift v</b> is the detuning between the pair’s pattern and the apparatus’s; <b>κ</b> scales the joint beat; <b>τ</b> and its spread set how long the phases run before they freeze. Here every station offset is zero, so what you see is the terrain alone. Tab 6 adds the frozen offsets ξ<sub>A</sub>, ξ<sub>B</sub> per event — the variety that turns this terrain into the quantum statistics.<br><br><b>A record.</b> The first version of this tab drove the phases with a thermal noise bath and drew particles streaming through the field along its lanes. Both are gone: the finished mechanism has no bath, and the field is a map of relative phase, not a room — the walkers are values of λ, and the lanes are lines of constant relative phase, not routes. The old tab reached about 44% of Hall’s floor; removing the bath is what let tab 6 pay the floor exactly.',
ui(){slider('drift v (the detuning)',0,12,0.1,v,x=>v=x);
 slider('joint-beat strength κ',0,3,0.01,kap,x=>kap=x);
 slider('flight time τ (mean)',0.5,8,0.1,tauMean,x=>tauMean=x);
 slider('flight-time spread',0,1,0.02,tauSpread,x=>tauSpread=x);
 button('cycle setting pair',()=>{pairIdx=(pairIdx+1)%4;buildField();spawn();});
 button('release new cohort',()=>spawn());
 button('ring ⇄ field',()=>view=1-view);},
step(){const a=pairs[pairIdx][0]*Math.PI/180,b=pairs[pairIdx][1]*Math.PI/180;
 const dt=0.004;
 for(let s=0;s<6;s++)for(const w of walkers){if(w.frozen)continue;
  let l=w.lam+(v-dU(w.lam,a,b))*dt;l%=Math.PI;if(l<0)l+=Math.PI;w.lam=l;
  w.age+=dt;if(w.age>=w.tau){w.frozen=true;hist[Math.floor(w.lam/Math.PI*72)%72]+=1;}}},
draw(){clear();
 const a=pairs[pairIdx][0],b=pairs[pairIdx][1],ar=a*Math.PI/180,br=b*Math.PI/180;
 let nf=0;for(const w of walkers)if(w.frozen)nf++;
 if(view===0){
  const cxx=W/2,cy=H/2,R=200;
  cx.strokeStyle='#1c2128';cx.lineWidth=1;cx.beginPath();cx.arc(cxx,cy,R,0,TAU);cx.stroke();
  /* the two analyzer axes on the register */
  for(const [ang,c,lab] of [[a,COL.teal,'Alice a='+a+'°'],[b+90,COL.vio,'Bob b='+b+'°']]){
   const t=ang*Math.PI/90;cx.strokeStyle=c;cx.globalAlpha=0.5;cx.lineWidth=2;
   cx.beginPath();cx.moveTo(cxx-Math.cos(t)*(R+26),cy-Math.sin(t)*(R+26));
   cx.lineTo(cxx+Math.cos(t)*(R+26),cy+Math.sin(t)*(R+26));cx.stroke();cx.globalAlpha=1;
   txt(lab,cxx+Math.cos(t)*(R+50)-24,cy+Math.sin(t)*(R+50),c,12);}
  /* the joint beat U(λ) drawn inside the ring: dips toward the centre are locks */
  cx.strokeStyle=COL.vio2;cx.lineWidth=1.6;cx.globalAlpha=0.9;cx.beginPath();
  for(let i=0;i<=180;i++){const l=i/180*Math.PI,t=2*l,r=R-52-38*U(l,ar,br);
   const X=cxx+Math.cos(t)*r,Y=cy+Math.sin(t)*r;i?cx.lineTo(X,Y):cx.moveTo(X,Y);}
  cx.closePath();cx.stroke();cx.globalAlpha=1;
  txt('U(λ): the joint beat of both analyzers',cxx-105,cy-118,COL.vio,12);
  txt('dips toward the centre = locks (v − U′ = 0)',cxx-105,cy-102,COL.dim,11);
  /* census of the frozen */
  let mx=1;for(let i=0;i<72;i++)mx=Math.max(mx,hist[i]);
  for(let i=0;i<72;i++){if(!hist[i])continue;const t=(i+0.5)/72*TAU;const h=hist[i]/mx*70;
   cx.strokeStyle=COL.emb;cx.globalAlpha=0.85;cx.lineWidth=5;
   cx.beginPath();cx.moveTo(cxx+Math.cos(t)*R,cy+Math.sin(t)*R);
   cx.lineTo(cxx+Math.cos(t)*(R+h),cy+Math.sin(t)*(R+h));cx.stroke();}
  cx.globalAlpha=1;
  /* the running phases */
  for(const w of walkers){if(w.frozen)continue;const t=w.lam*2;
   cx.fillStyle=COL.teal;cx.globalAlpha=0.7;
   cx.beginPath();cx.arc(cxx+Math.cos(t)*(R-14),cy+Math.sin(t)*(R-14),2.1,0,TAU);cx.fill();}
  cx.globalAlpha=1;
  txt('teal dots: hidden phases λ still running · ember: where they froze',20,36,COL.dim,13);
 } else {
  for(let iy=0;iy<GH;iy++)for(let ix=0;ix<GW;ix++){
   const g=G[iy*GW+ix];
   cx.fillStyle='rgb('+Math.round(8+22*g)+','+Math.round(16+70*g)+','+Math.round(20+62*g)+')';
   cx.fillRect(ix*7.86,iy*7.9,8,8);}
  /* the register slice: U(λ) as a profile along the bottom */
  const gx=40,gw=W-80,gy=H-60,gh=44;
  cx.fillStyle='rgba(13,17,23,0.75)';cx.fillRect(gx-10,gy-gh-14,gw+20,gh+40);
  cx.strokeStyle=COL.vio2;cx.lineWidth=1.6;cx.beginPath();
  for(let i=0;i<=200;i++){const l=i/200*Math.PI;const X=gx+i/200*gw,Y=gy-gh*(0.5+0.42*U(l,ar,br));
   i?cx.lineTo(X,Y):cx.moveTo(X,Y);}cx.stroke();
  txt('λ = 0',gx,gy+14,COL.dim,10);txt('λ = π',gx+gw-26,gy+14,COL.dim,10);
  txt('U(λ) — the same joint beat, read as a profile along the register',gx,gy-gh-2,COL.vio,11);
  txt('the standing beat pattern of the apparatus: Alice’s fence at a, Bob’s at b — the two lattices whose overlap is U',20,36,COL.dim,13);
 }
 txt('setting pair: a='+a+'°, b='+b+'°   ·   frozen '+nf+' / '+N+'   ·   no noise: every trajectory is deterministic',20,H-16,COL.dim,12);}});
})();

/* ================= SCENE 3 : THE DECISION ================= */
(function(){
let aDeg=0,auto=true;const phots=[];let nDet=0,nTot=0,nUp=0,nDn=0;
scenes.push({name:'3 · the decision',
cap:'<span class=lead>One photon, one analyzer, the hidden phase visible.</span> Each photon carries a <span class=t>needle: its phase λ</span>. At an analyzer set to a, the alignment is m = |cos 2(λ−a)|. Needles near the analyzer’s axis (m near 1) are always registered and deflect along that axis — teal one way, ember the other. Needles near the <b>edge</b>, 45° off, are the undecided register: under the solved law D(m) = √m·h(m) they <span class=e>slide past unregistered</span>. Rotate a and watch: <i>which</i> photons are registered changes; <i>how many</i> does not. The hidden phases arrive uniformly, so the singles counters cannot move — no-signaling, on camera. Nothing Alice does with her dial reaches Bob’s counters; everything in tab 4 lives in the pairings.<br><br>Read this tab with one caveat now on record. The needle here is <b>static</b>: λ reaches the analyzer unchanged from birth. That is the Sec. 5 model of arXiv:2608.18886, and it reproduces the pair statistics at η ≈ 0.80 with zero measurement dependence — but as a single-photon account it fails Malus’s law (one photon through two sequential polarizers) by about 5%, because the singlet forces D ~ √m at the edge while Malus forces D ~ m (repository: <i>malus_check.py</i>). The mechanism of tab 6 does not leave λ static: the lock rewrites it. This tab shows the sliding edge; tab 6 shows what a fence does to the phase that meets it.',
ui(){slider('analyzer angle a',0,180,1,aDeg,v=>aDeg=v);
 button('toggle photon stream',()=>auto=!auto);
 button('reset counters',()=>{nDet=0;nTot=0;nUp=0;nDn=0;});},
step(){if(auto&&frame%4===0){phots.push({x:60,y:H/2,vx:6,vy:0,lam:Math.random()*Math.PI,st:0,m:0,a:1,w:0});}
 const ar=aDeg*Math.PI/180;
 for(const p of phots){
  if(p.st===0){p.x+=p.vx;
   if(p.x>=W/2-40){
    p.m=Math.abs(Math.cos(2*(p.lam-ar)));nTot++;
    if(Math.random()<Dm(p.m)){nDet++;
     const sg=Math.sign(Math.cos(2*(p.lam-ar)))||1;
     if(sg>0)nUp++;else nDn++;
     p.st=sg;p.vx=5.2*Math.abs(Math.cos(ar))+1.5;p.vy=-5.2*Math.sin(ar)*sg-(sg>0?2.4:-2.4)*Math.cos(ar);}
    else {p.st=9;p.vx=1.2;}}}
  else if(p.st===9){p.w+=0.35;p.x+=p.vx;p.y+=Math.sin(p.w)*1.6;p.a-=0.012;}
  else {p.x+=p.vx;p.y+=p.vy;}}
 while(phots.length&&(phots[0].x>W+20||phots[0].a<=0))phots.shift();},
draw(){clear();const ax=W/2-40;const ar=aDeg*Math.PI/180;
 cx.save();cx.translate(ax,H/2);cx.rotate(ar);
 for(let u=-260;u<260;u+=28){cx.fillStyle=u/28%2?'#1a2530':'#101821';
  cx.fillRect(-9,u,18,28);}
 cx.strokeStyle=COL.vio2;cx.lineWidth=2;cx.strokeRect(-9,-260,18,520);cx.restore();
 txt('analyzer axis',ax+Math.sin(ar)*270,H/2-Math.cos(ar)*270-6,COL.vio,11,'center');
 for(const p of phots){
  const bright=p.st===0?0.9:(p.st===9?Math.max(0,p.a):0.45+0.55*p.m);
  cx.globalAlpha=bright;
  const c=p.st===9?COL.dim:(p.st===1?COL.teal:(p.st===-1?COL.emb:'#c9c6bd'));
  cx.fillStyle=c;cx.beginPath();cx.arc(p.x,p.y,4,0,TAU);cx.fill();
  cx.strokeStyle=c;cx.lineWidth=1.6;
  cx.beginPath();
  cx.moveTo(p.x-8*Math.cos(p.lam),p.y+8*Math.sin(p.lam));
  cx.lineTo(p.x+8*Math.cos(p.lam),p.y-8*Math.sin(p.lam));cx.stroke();
  cx.globalAlpha=1;}
 const gx=W-320,gy=90,gw=270,gh=150;
 txt('D(m) = √m · h(m)',gx,gy-12,COL.teal,14);
 cx.strokeStyle='#26302c';cx.strokeRect(gx,gy,gw,gh);
 cx.beginPath();for(let i=0;i<=100;i++){const m=i/100;
  const X=gx+m*gw,Y=gy+gh-Dm(m)*gh*0.92;i?cx.lineTo(X,Y):cx.moveTo(X,Y);}
 cx.strokeStyle=COL.teal;cx.lineWidth=2.2;cx.stroke();cx.lineWidth=1;
 txt('edge: slides past',gx,gy+gh+16,COL.embL,11);
 txt('center: always seen',gx+150,gy+gh+16,COL.dim,11);
 txt('η ≈ '+(nTot?(nDet/nTot).toFixed(3):'—')+'   (theory ceiling 0.801)',20,30,COL.teal,15);
 txt('+1: '+nUp+'    −1: '+nDn+'    slid past: '+(nTot-nDet),20,52,COL.dim,13);
 txt('rotate a: routes change, counters do not — no-signaling, live',20,74,COL.embL,12);}});
})();

/* ================= SCENE 4 : THE CONVERGENCE ================= */
(function(){
let bins=61,sumE,cntE,Sacc=0,Scnt=0,speed=400;
function reset(){sumE=new Float32Array(bins);cntE=new Float32Array(bins);Sacc=0;Scnt=0;}
reset();
const bell=[[0,22.5,1],[0,67.5,-1],[45,22.5,1],[45,67.5,1]];
function pairE(dl){const lam=Math.random()*Math.PI;
 const a=Math.random()*Math.PI, b=a+dl;   // absolute analyzer angles
 const ca=Math.cos(2*(lam-a)),cb=Math.cos(2*(lam+Math.PI/2-b));
 if(Math.random()<Dm(Math.abs(ca))&&Math.random()<Dm(Math.abs(cb)))
  return Math.sign(ca)*Math.sign(cb)||1;return 0;}
scenes.push({name:'4 · the convergence',
cap:'<span class=lead>Pairs from one source, one shared λ, two local sign rules, one local detection law each. Nothing communicates.</span> Each side decides by the sign of cos 2(λ − setting) and is registered or slides by D(m). Count only pairs where both were registered, and the surviving coincidences trace the <span class=t>quantum cosine</span> — here to a few tenths of a percent from a 22-point interpolation of the solved profile; the exact profile lands at 10<sup>−11</sup> — while the CHSH ticker climbs to <span class=e>2√2 = 2.8284</span>.<br><br><b>The bill.</b> A local account of this curve pays in one of two currencies or a mixture: a ceiling on detection efficiency (η ≈ 0.80 for the pure-detection profile), or measurement dependence in the phase distribution (Hall’s floor, M = (√2 − 1)/3 ≈ 0.138), with every mixture priced by the surface M(S, η) of Sec. 3 and certified in exact arithmetic at the quantum point and six rational points. Two facts have narrowed the dial since the paper’s first version: pure detection cannot also deliver flat coincidence rates (Proposition 1), and pure detection with a static phase is excluded as a single-photon account by Malus’s law (tab 3). What survives lives toward the measurement-dependence end — which tab 6 pays exactly.',
ui(){slider('pairs per frame',50,2000,50,speed,v=>speed=v);
 button('reset counters',reset);},
step(){for(let k=0;k<speed;k++){
  const bi=Math.floor(Math.random()*bins);const dl=bi/(bins-1)*Math.PI;
  const e=pairE(dl);if(e!==0){sumE[bi]+=e;cntE[bi]++;}
  const b4=bell[Math.floor(Math.random()*4)];
  const e4=pairE((b4[1]-b4[0])*Math.PI/180);
  if(e4!==0){Sacc+=b4[2]*e4*4;Scnt++;}}},
draw(){clear();const gx=90,gy=60,gw=W-360,gh=H-150;
 cx.strokeStyle='#26302c';cx.strokeRect(gx,gy,gw,gh);
 cx.setLineDash([5,5]);cx.beginPath();
 for(let i=0;i<=200;i++){const d=i/200*Math.PI;
  const X=gx+i/200*gw,Y=gy+gh/2-(-Math.cos(2*d))*gh/2*0.92;
  i?cx.lineTo(X,Y):cx.moveTo(X,Y);}
 cx.strokeStyle=COL.vio2;cx.stroke();cx.setLineDash([]);
 for(let i=0;i<bins;i++){if(cntE[i]<8)continue;
  const d=i/(bins-1),E=sumE[i]/cntE[i];
  const X=gx+d*gw,Y=gy+gh/2-E*gh/2*0.92;
  cx.fillStyle=COL.teal;cx.beginPath();cx.arc(X,Y,3.2,0,TAU);cx.fill();}
 txt('E(Δ) — dots: this local universe · dashed: quantum mechanics',gx,gy-14,COL.dim,13);
 txt('0°',gx-4,gy+gh+20);txt('90°',gx+gw/2-10,gy+gh+20);txt('180°',gx+gw-16,gy+gh+20);
 const S=Scnt?Math.abs(Sacc/Scnt):0;
 txt('CHSH',W-230,140,COL.dim,15);
 txt(S.toFixed(4),W-230,185,COL.embL,38);
 txt('target  2.8284',W-230,215,COL.vio,14);
 txt('pairs: '+(Scnt+Array.from(cntE).reduce((a,b)=>a+b,0)).toLocaleString(),W-230,245,COL.dim,12);
 txt('local bound (no sliding): 2.0000',W-230,275,COL.dim,12);}});
})();

/* ================= SCENE 5 : THE PIXEL ================= */
(function(){
const NA=24;let counts=new Float32Array(NA*NA),eps=2.0,mode=0,Fmag=null;
const f=[],g=[];for(let i=0;i<NA;i++){const a=i*Math.PI/NA;
 f.push(1+0.03*Math.cos(2*a+1.1)+0.012*Math.cos(4*a+0.4));
 g.push(1+0.025*Math.cos(2*a+2.3)+0.015*Math.cos(4*a+1.7));}
function accumulate(n){for(let k=0;k<n;k++){
 const i=Math.floor(Math.random()*NA),j=Math.floor(Math.random()*NA);
 const d=(i-j)*Math.PI/NA;
 const mu=f[i]*g[j]*(1+eps/100*(Math.cos(4*d)+0.17*Math.cos(8*d)));
 counts[i*NA+j]+=mu*(1+0.15*(Math.random()*2-1));}}
function dft(){const L=new Float32Array(NA*NA);
 for(let i=0;i<NA*NA;i++)L[i]=Math.log(counts[i]+1e-9);
 Fmag=new Float32Array(NA*NA);
 for(let ka=0;ka<NA;ka++)for(let kb=0;kb<NA;kb++){let re=0,im=0;
  for(let i=0;i<NA;i++)for(let j=0;j<NA;j++){
   const ph=-TAU*(ka*i+kb*j)/NA;re+=L[i*NA+j]*Math.cos(ph);im+=L[i*NA+j]*Math.sin(ph);}
  Fmag[ka*NA+kb]=Math.hypot(re,im)/(NA*NA);}}
scenes.push({name:'5 · the pixel',
cap:'<span class=lead>The experiment nobody ran.</span> Scan the full settings torus (a, b), 24 × 24, and count <b>total</b> coincidences — all four outcome combinations summed. Quantum mechanics says that total is flat. Apparatus response factorizes, η_A(a)·η_B(b), and after the logarithm it is additive, so it lives on the <b>rows and columns</b> of the Fourier plane. The physical signal cos 4(a−b) is irreducibly joint and lives on the anti-diagonal, at (k_a, k_b) = <span class=e>(±2, ∓2)</span>, with its overtone at (±4, ∓4) about six times fainter. Orientation follows Fig. 5 of the paper: k_a increases upward, k_b to the right.<br><br><b>Why four decades missed it.</b> The hiding theorem: cos(2k·45°) = cos(2k·135°) for every harmonic k, so the fringe vanishes identically at 22.5° and 67.5°, and every four-point CHSH experiment is mathematically blind to it. The practical scans were blind too: the fourfold sum is the <i>denominator</i> of E(a, b), the number every design normalizes away; and in a single-analyzer scan cos 4(a−b) is indistinguishable from a polarization-dependent efficiency η_B(b), the most common systematic in optics. Only the full torus with the log-Fourier veto separates them. Aspect logged the sum as “typically 80/s”; a 1998 analysis noted the missing error bar; a 2003 proposal was never run. Slide ε to zero and the pixel goes dark — that darkness is quantum mechanics’ claim. Twenty minutes at 10<sup>6</sup> pairs/s tests it at 0.1%.',
ui(){slider('fringe ε (%)',0,3,0.1,eps,v=>{eps=v;counts.fill(0);mode=0;});
 button('transform ⇄',()=>{if(mode===0){dft();mode=1;}else mode=0;});
 button('reset',()=>{counts.fill(0);mode=0;});},
step(){if(mode===0)accumulate(3000);},
draw(){clear();const sz=Math.min(W,H)-130,px=sz/NA,ox=(W-sz)/2,oy=70;
 if(mode===0){let mx=1e-9;for(const c of counts)mx=Math.max(mx,c);
  for(let i=0;i<NA;i++)for(let j=0;j<NA;j++){
   const v=counts[i*NA+j]/mx;
   cx.fillStyle='rgb('+Math.round(10+30*v)+','+Math.round(20+140*v)+','+Math.round(25+105*v)+')';
   cx.fillRect(ox+j*px,oy+(NA-1-i)*px,px-1,px-1);}
  txt('total coincidence rate over the settings torus (a, b) — accumulating',ox,oy-16,COL.dim,13);
  txt('Alice ↑   Bob →   fringe ε = '+eps.toFixed(1)+'%   (hidden inside: 3% apparatus ripple + noise)',ox,oy+sz+24,COL.dim,12);}
 else{let mx=1e-9;for(let i=0;i<NA*NA;i++){const ka=Math.floor(i/NA),kb=i%NA;
   if(ka===0&&kb===0)continue;mx=Math.max(mx,Fmag[i]);}
  for(let ka=0;ka<NA;ka++)for(let kb=0;kb<NA;kb++){
   const sa=(ka+NA/2)%NA,sb=(kb+NA/2)%NA;
   let v=(ka===0&&kb===0)?1:Fmag[ka*NA+kb]/mx;v=Math.pow(v,0.4);
   cx.fillStyle='rgb('+Math.round(8+70*v)+','+Math.round(12+90*v)+','+Math.round(20+180*v)+')';
   cx.fillRect(ox+sb*px,oy+(NA-1-sa)*px,px-1,px-1);}
  const pulse=3+2*Math.sin(frame*0.1);
  for(const [ka,kb] of [[2,-2],[-2,2]]){
   const sa=((ka%NA)+NA+NA/2)%NA,sb=((kb%NA)+NA+NA/2)%NA;
   cx.strokeStyle=COL.emb;cx.lineWidth=2.5;
   cx.strokeRect(ox+sb*px-pulse,oy+(NA-1-sa)*px-pulse,px+2*pulse,px+2*pulse);}
  txt('log-Fourier plane — apparatus on the axes, physics at (k_a, k_b) = (±2, ∓2)',ox,oy-16,COL.dim,13);
  txt('k_a (Alice) ↑',ox-70,oy+sz/2,COL.dim,12);txt('k_b (Bob) →',ox+sz/2-30,oy+sz+44,COL.dim,12);
  txt('the pixel hardware cannot reach  ·  truth ε = '+eps.toFixed(1)+'%  ·  QM predicts: dark',ox,oy+sz+24,COL.embL,13);}}});
})();


/* ================= SCENE 6 : THE CENSUS ================= */
(function(){
let v=15,variety=1.0,pairIdx=0;
const pairs=[[0,22.5],[0,67.5],[45,22.5],[45,67.5]];
const N=420;
let walkers=[], hist=new Float32Array(90);
function dU(l,A,B){
 const p1=4*A+2*B+Math.PI, p2=4*A-2*B-Math.PI;
 return 0.42*12*Math.sin(6*l-p1)+0.31*4*Math.sin(2*l-p2)
       +0.9*16*Math.sin(8*l-2*A-6*B-3*Math.PI);}
function spawn(){
 walkers=[];
 const a=pairs[pairIdx][0]*Math.PI/180, b=pairs[pairIdx][1]*Math.PI/180;
 for(let i=0;i<N;i++){
  const xa=variety*(Math.random()*Math.PI);
  const xb=variety*(Math.random()*Math.PI);
  const tau=0.4+variety*Math.random()*5.6+(1-variety)*2.6;
  walkers.push({lam:Math.random()*Math.PI, xa, xb,
   A:a+xa, B:b+xb, tau, age:0, y:30+Math.random()*(H-120),
   frozen:false});}
}
spawn();
scenes.push({name:'6 · the census',
cap:'<span class=lead>Moiré phase locking, whole: the census.</span> Every dot is one pair event. Each carries a <b>frozen inheritance</b> drawn once at birth: a private offset for each station (ξ_A, ξ_B) and a private flight time τ. Then — <b>no noise, no dice</b> — λ drifts deterministically through its own beat terrain, dλ/dt = v − U′(λ), until its clock runs out and it <span class=e>freezes where it stands</span>. The histogram is the census of the frozen, and <i>that census is the quantum statistics</i>. Cycle the setting pair: the whole census reorganizes, because every private terrain belongs to the apparatus.<br><br>Drag <b>variety → 0</b>: every event identical, the census collapses to a spike — dead, classical, mute. Slide it back and the arcs return. <b>Frozen variety is the resource</b> — not noise; a different frozen hand for every throw. What are the offsets offsets <i>of</i>? The paper leaves the formation of ρ open. The ontology’s proposal: both photons are born into one lab lattice, and its texture is what ξ_A, ξ_B, τ are frozen samples of — setting-independent, nonuniform, joint, as ρ must be. This tab is a 3-term sketch. The full 23-term mechanism with a 1024-offset ensemble attains Hall’s floor to twelve significant digits at 1% fidelity on 161 angles (Sec. 7 of arXiv:2608.18886 v3); its residual fingerprint is a softening of the correlation extremes between the Bell angles.',
ui(){slider('drift v (the detuning)',4,26,0.5,v,x=>v=x);
 slider('variety (the frozen spread)',0,1,0.02,variety,x=>{variety=x;});
 button('cycle setting pair',()=>{pairIdx=(pairIdx+1)%4;hist.fill(0);spawn();});
 button('release new cohort',()=>{spawn();});},
step(){const dt=0.004;
 let allFrozen=true;
 for(const w of walkers){
  if(w.frozen)continue;
  allFrozen=false;
  for(let s=0;s<5;s++){
   w.lam+=(v-dU(w.lam,w.A,w.B))*dt;
   w.age+=dt;
   if(w.age>=w.tau){w.frozen=true;
    const bi=Math.floor(((w.lam%Math.PI+Math.PI)%Math.PI)/Math.PI*90)%90;
    hist[bi]+=1;break;}}}
 if(allFrozen){for(let i=0;i<90;i++)hist[i]*=0.93;spawn();}},
draw(){clear();
 const a=pairs[pairIdx][0],b=pairs[pairIdx][1];
 const PW=W-260;
 for(let g=0;g<=6;g++){const x=g/6*PW;
  cx.strokeStyle='#1a1f24';cx.beginPath();cx.moveTo(x,20);cx.lineTo(x,H-90);cx.stroke();
  txt((g*30)+'\u00b0',x-8,H-72,COL.dim,10);}
 let nf=0;
 for(const w of walkers){
  const x=((w.lam%Math.PI+Math.PI)%Math.PI)/Math.PI*PW;
  if(w.frozen){nf++;
   cx.fillStyle=COL.emb;cx.globalAlpha=0.85;
   cx.beginPath();cx.arc(x,w.y,2.6,0,TAU);cx.fill();
  }else{
   cx.fillStyle=COL.teal;cx.globalAlpha=0.55+0.3*Math.min(1,w.age/w.tau);
   cx.beginPath();cx.arc(x,w.y,2.0,0,TAU);cx.fill();}
 }
 cx.globalAlpha=1;
 let hm=1;for(const h of hist)hm=Math.max(hm,h);
 for(let i=0;i<90;i++){
  const x=i/90*PW, hgt=hist[i]/hm*54;
  cx.fillStyle=COL.emb;cx.globalAlpha=0.8;
  cx.fillRect(x,H-64-hgt,PW/90-1,hgt);}
 cx.globalAlpha=1;
 const hx=W-235,hy=60;
 txt('THE CENSUS',hx,hy-24,COL.embL,14);
 txt('frozen: '+nf+' / '+N,hx,hy,COL.dim,12);
 txt('variety: '+(variety*100).toFixed(0)+'%',hx,hy+20,COL.dim,12);
 let s=0;for(let i=0;i<90;i++)s+=hist[i];
 let tv=0;for(let i=0;i<90;i++)tv+=Math.abs(hist[i]/(s||1)-1/90);
 txt('dist. from uniform (proxy): '+(tv/2).toFixed(3),hx,hy+40,COL.dim,12);
 txt('certified floor \u2248 0.138',hx,hy+60,COL.dim,11);
 txt(variety<0.15?'variety gone \u2014 the magic is dead':'frozen variety at work',
     hx,hy+92,variety<0.15?'#b06060':COL.teal,12);
 txt('setting pair: a='+a+'\u00b0, b='+b+'\u00b0   \u00b7   each dot: private offsets + private clock, drawn ONCE   \u00b7   no dice anywhere',20,H-16,COL.dim,12);}});
})();

scenes.forEach((s,i)=>{const t=document.createElement('div');t.className='tab';
 t.textContent=s.name;t.onclick=()=>setScene(i);tabsEl.appendChild(t);});
setScene(0);
(function loop(){frame++;const s=scenes[cur];s.step();s.draw();requestAnimationFrame(loop);})();
</script>
